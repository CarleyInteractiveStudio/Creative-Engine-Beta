<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Creative Engine | Game Runner</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
    </style>
</head>
<body>
    <canvas id="game-canvas"></canvas>
    <script>
        // Signal to opener that we are ready
        if (window.opener) {
            window.opener.postMessage({ type: 'CE_RUNNER_READY' }, '*');
        }
    </script>
</body>
</html>
